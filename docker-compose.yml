services:
  postgres:
    image: postgres:16-alpine
    container_name: calo-calculate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: calo_calculate
      POSTGRES_USER: calo_user
      POSTGRES_PASSWORD: calo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./nodejs/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
